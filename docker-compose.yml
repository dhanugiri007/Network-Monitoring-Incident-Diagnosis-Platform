services:
  postgres:
    image: postgres:16
    container_name: netpulse-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: netpulse123
      POSTGRES_DB: netpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: netpulse-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: